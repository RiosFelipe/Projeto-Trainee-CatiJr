spring.application.name=sistema-de-matriculas

# Configuração do Postgres 

# URL de conexão: altera "sistema_matriculas" para o nome do banco no Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_matriculas

# Usuário e Senha do PostgreSQL 
spring.datasource.username=postgres
spring.datasource.password=admin

# Driver do banco de dados
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
# O 'update' faz o Spring criar as tabelas automaticamente no Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Configuração do JWT

#chave secreta
jwt.secret-key=d7a12b9c3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b

#tempo de expirar de 2 horas (em milissegundos)
jwt.expiration-time=7200000